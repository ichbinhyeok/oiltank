spring.application.name=OilTankRoute
gg.jte.templateLocation=src/main/jte
gg.jte.usePrecompiledTemplates=${GG_JTE_USE_PRECOMPILED_TEMPLATES:true}
gg.jte.developmentMode=${GG_JTE_DEVELOPMENT_MODE:false}
gg.jte.trimControlStructures=true
buried-oil-tank.base-url=${BURIED_OIL_TANK_BASE_URL:http://localhost:8080}
buried-oil-tank.storage-root=${BURIED_OIL_TANK_STORAGE_ROOT:storage}
buried-oil-tank.analytics-measurement-id=${BURIED_OIL_TANK_ANALYTICS_MEASUREMENT_ID:}
buried-oil-tank.admin.username=${BURIED_OIL_TANK_ADMIN_USERNAME:admin}
buried-oil-tank.admin.password=${BURIED_OIL_TANK_ADMIN_PASSWORD:change-me-local}
buried-oil-tank.notifications.enabled=${BURIED_OIL_TANK_NOTIFICATION_ENABLED:false}
buried-oil-tank.notifications.recipient=${BURIED_OIL_TANK_NOTIFICATION_TO:}
buried-oil-tank.notifications.sender=${BURIED_OIL_TANK_NOTIFICATION_FROM:}
buried-oil-tank.notifications.smtp-host=${BURIED_OIL_TANK_SMTP_HOST:}
buried-oil-tank.notifications.smtp-port=${BURIED_OIL_TANK_SMTP_PORT:587}
buried-oil-tank.notifications.smtp-username=${BURIED_OIL_TANK_SMTP_USERNAME:}
buried-oil-tank.notifications.smtp-password=${BURIED_OIL_TANK_SMTP_PASSWORD:}
buried-oil-tank.notifications.start-tls=${BURIED_OIL_TANK_SMTP_STARTTLS:true}
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=32KB
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=22MB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
