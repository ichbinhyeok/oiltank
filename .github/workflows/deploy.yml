name: Deploy OiltankRoute to OCI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: oiltankroute-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: ./mvnw test

      - name: Validate deployment secrets
        env:
          APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          test -n "$APP_ADMIN_USERNAME"
          test -n "$APP_ADMIN_PASSWORD"
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          test -n "$OCI_HOST"
          test -n "$OCI_USERNAME"
          test -n "$OCI_KEY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            shinhyeok22/oiltank:latest
            shinhyeok22/oiltank:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shinhyeok22/oiltank:${{ github.sha }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          timeout: 10m

      - name: Copy compose file to OCI
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_KEY }}
          source: "docker-compose.yml"
          target: "~/deploy/oiltankroute"
          overwrite: true

      - name: Deploy on OCI host
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_KEY }}
          script: |
            set -euo pipefail

            APP_DIR="$HOME/deploy/oiltankroute"
            mkdir -p "$APP_DIR/storage" "$APP_DIR/logs"

            cat > "$APP_DIR/.env" <<EOF
            IMAGE_NAME=shinhyeok22/oiltank:${{ github.sha }}
            SPRING_PROFILES_ACTIVE=prod
            BURIED_OIL_TANK_BASE_URL=https://oiltankroute.com
            BURIED_OIL_TANK_ADMIN_USERNAME=${{ secrets.APP_ADMIN_USERNAME }}
            BURIED_OIL_TANK_ADMIN_PASSWORD=${{ secrets.APP_ADMIN_PASSWORD }}
            JAVA_OPTS=-XX:+UseG1GC -Xms256m -Xmx384m -Xss512k -Djava.security.egd=file:/dev/./urandom
            EOF

            cd "$APP_DIR"
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f

            for attempt in $(seq 1 24); do
              HEALTH_JSON=$(curl -fsS http://127.0.0.1:8097/actuator/health || true)
              if echo "$HEALTH_JSON" | grep -q '"status":"UP"'; then
                echo "Health check passed on attempt $attempt."
                break
              fi

              echo "Health check not ready yet, attempt $attempt/24."
              sleep 5
            done

            HEALTH_JSON=$(curl -fsS http://127.0.0.1:8097/actuator/health || true)
            if ! echo "$HEALTH_JSON" | grep -q '"status":"UP"'; then
              echo "App health check failed after deploy."
              docker compose logs --tail=200 app
              exit 1
            fi

            LOCAL_HEADERS=$(curl -fsSI http://127.0.0.1:8097/ | tr -d '\r' || true)
            if ! echo "$LOCAL_HEADERS" | grep -qi '^Location: https://oiltankroute.com/$'; then
              echo "Local canonical redirect check failed."
              echo "$LOCAL_HEADERS" | sed -n '1,40p'
              exit 1
            fi

            PUBLIC_HTML=""
            for attempt in $(seq 1 12); do
              PUBLIC_HTML=$(curl -fsSL https://oiltankroute.com/ || true)
              if echo "$PUBLIC_HTML" | grep -q "Oil Tank Route"; then
                echo "Public domain check passed on attempt $attempt."
                break
              fi
              echo "Public domain not ready yet, attempt $attempt/12."
              sleep 5
            done

            if ! echo "$PUBLIC_HTML" | grep -q "Oil Tank Route"; then
              echo "Public domain check failed."
              echo "$PUBLIC_HTML" | sed -n '1,120p'
              exit 1
            fi

            SITEMAP_XML=$(curl -fsSL https://oiltankroute.com/sitemap.xml || true)
            if ! echo "$SITEMAP_XML" | grep -q "https://oiltankroute.com/heating-oil-tank/"; then
              echo "Public sitemap check failed."
              exit 1
            fi
